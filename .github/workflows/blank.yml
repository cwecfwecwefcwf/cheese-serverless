name: qwq
on:
  workflow_dispatch: 
  push:
  schedule:
  - cron: "0 2-16 * * *"
  

jobs:
  worker:
    runs-on: windows-latest
    timeout-minutes: 55
    strategy:
      matrix:
        task: [1]
    steps:
    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: SetUp-Env
      run: |
        curl -sS -o ocr.7z https://${{ secrets.BASE }}/ocr.7z
        
        choco install 7zip
        7z x ocr.7z -oD:\a\_temp\

        cd "D:\a\_temp\"
       
        curl -o mitm.exe https://${{ secrets.REMOTE }}/mitm_2k26.8.15.exe
        
        curl -sS -o config.yml https://${{ secrets.BASE }}/x19-client/config.yml
        curl -sS -o main.jar https://${{ secrets.BASE }}/x19-client/main.jar
    - name: Running
      run: |
        cd "D:\a\_temp\"
        Start-Process ".\mitm.exe" -ArgumentList "8441 ptlogin.4399.com" -NoNewWindow
        java -jar client.jar
